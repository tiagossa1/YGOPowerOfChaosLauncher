name: Build Windows launcher

on:
  push:
    branches: [main]
    paths:
      - 'ModTools/**'
      - 'README.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            ModTools/launcher-requirements.txt
            ModTools/dev-requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ModTools/dev-requirements.txt

      - name: Lint
        run: python -m ruff check ModTools/launcher.py ModTools/test_launcher_quality.py

      - name: Run unit and UI tests
        run: python -m pytest ModTools -q --junitxml=test-results/pytest.xml

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --name "Legend Reborn Launcher" ModTools/launcher.py

      - name: Package launcher
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path package, release | Out-Null
          Copy-Item -LiteralPath 'dist/Legend Reborn Launcher.exe' -Destination package
          Copy-Item -LiteralPath README.md -Destination package
          $archive = 'release/YGOPowerOfChaosLauncher-windows-x64.zip'
          Compress-Archive -Path 'package/*' -DestinationPath $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-test-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
