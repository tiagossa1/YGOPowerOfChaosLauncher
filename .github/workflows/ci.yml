name: Tests and lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Windows / Python 3.14
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            ModTools/launcher-requirements.txt
            ModTools/dev-requirements.txt

      - name: Install dependencies
        run: python -m pip install -r ModTools/dev-requirements.txt

      - name: Lint
        run: python -m ruff check ModTools/launcher.py ModTools/test_launcher_quality.py

      - name: Run unit and UI tests
        if: ${{ !cancelled() }}
        run: python -m pytest ModTools -q --junitxml=test-results/pytest.xml

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-pytest-results
          path: test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
